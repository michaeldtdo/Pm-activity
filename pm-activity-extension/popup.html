<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PM Activity Tracker</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      margin: 0;
      background: #f8f9fa;
    }

    h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 16px 0;
      color: #202124;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-card {
      background: white;
      border-radius: 8px;
      padding: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .stat-value {
      font-size: 24px;
      font-weight: 600;
      color: #1a73e8;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 12px;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .section {
      background: white;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-bottom: 8px;
    }

    button:last-child {
      margin-bottom: 0;
    }

    .btn-primary {
      background: #1a73e8;
      color: white;
    }

    .btn-primary:hover {
      background: #1557b0;
    }

    .btn-secondary {
      background: #e8f0fe;
      color: #1a73e8;
    }

    .btn-secondary:hover {
      background: #d2e3fc;
    }

    .btn-danger {
      background: #fce8e6;
      color: #d93025;
    }

    .btn-danger:hover {
      background: #f6aea9;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #e8f5e9;
      border-radius: 6px;
      margin-bottom: 12px;
    }

    .status-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #34a853;
    }

    .status-text {
      font-size: 13px;
      color: #137333;
      font-weight: 500;
    }

    .status.error {
      background: #fce8e6;
    }

    .status.error .status-indicator {
      background: #d93025;
    }

    .status.error .status-text {
      color: #d93025;
    }

    .info-text {
      font-size: 12px;
      color: #5f6368;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #5f6368;
    }
  </style>
</head>
<body>
  <h1>PM Activity Tracker</h1>

  <div id="loading" class="loading">
    Loading...
  </div>

  <div id="content" style="display: none;">
    <div id="status" class="status">
      <div class="status-indicator"></div>
      <div class="status-text">Tracking active</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="today-count">0</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-count">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="buffer-count">0</div>
        <div class="stat-label">Buffered</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="snippets-count">0</div>
        <div class="stat-label">Snippets</div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">Actions</div>
      <button id="flush-btn" class="btn-primary">Flush to PM Agent</button>
      <button id="clear-btn" class="btn-danger">Clear All Data</button>
    </div>

    <div class="section">
      <div class="info-text">
        <strong>Phase 1:</strong> Activity tracking is active. Content capture will be available in Phase 2.
      </div>
      <div class="info-text">
        Activity logs are buffered and sent to ~/.pm-agent/activity.jsonl every 10 events or 5 minutes.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
